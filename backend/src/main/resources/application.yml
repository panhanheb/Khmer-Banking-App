spring:
  application:
    name: khmer-digital-bank
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/khmerbank}
    username: ${DB_USERNAME:khmerbank}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # Flyway owns the schema
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  env: ${APP_ENV:local}
  timezone: Asia/Phnom_Penh
  security:
    # Must be >= 32 bytes. Never commit a real secret — supply via environment/vault.
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    otp-pepper: ${OTP_PEPPER:}
    max-failed-logins: 5
    login-lock-duration: PT15M
    max-failed-pins: 5
    pin-lock-duration: PT30M
    otp-ttl: PT5M
    otp-max-attempts: 5
  otp:
    # true only in dev: echoes the OTP in API responses for local testing
    expose-in-response: false
  rate-limit:
    store: ${RATE_LIMIT_STORE:redis}   # redis | memory
    auth-requests-per-minute: 20
  accounts:
    max-per-user: 10
    branch-code: "001"

logging:
  level:
    com.khmerbank: INFO
