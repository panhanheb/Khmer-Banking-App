spring:
  application:
    name: khmer-digital-bank
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/khmerbank}
    username: ${DB_USERNAME:khmerbank}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # Flyway owns the schema
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  env: ${APP_ENV:local}
  timezone: Asia/Phnom_Penh
  firebase:
    # Firebase project whose Authentication ID tokens the API accepts.
    project-id: ${FIREBASE_PROJECT_ID:khmer-flutter-bank}
  security:
    max-failed-pins: 5
    pin-lock-duration: PT30M
  rate-limit:
    store: ${RATE_LIMIT_STORE:redis}   # redis | memory
    auth-requests-per-minute: 20
  accounts:
    max-per-user: 10
    branch-code: "001"

logging:
  level:
    com.khmerbank: INFO
