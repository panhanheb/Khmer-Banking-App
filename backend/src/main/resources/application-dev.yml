# Local development profile. Mock integrations are enabled and money created via
# /api/v1/dev/** is flagged simulated = true.
spring:
  datasource:
    password: ${DB_PASSWORD:khmerbank_dev}

app:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    otp-pepper: ${OTP_PEPPER:dev-only-pepper}
  otp:
    expose-in-response: true
  rate-limit:
    store: ${RATE_LIMIT_STORE:memory}

logging:
  level:
    com.khmerbank: DEBUG
