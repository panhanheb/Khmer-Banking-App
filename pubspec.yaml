name: coupon
description: "Khmer Digital Bank mobile app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0

  # NOTE: freezed/json_serializable code generation is intentionally NOT used.
  # Models are hand-written immutable classes with fromJson/toJson + Equatable,
  # which keeps the build free of build_runner and keeps money fields explicit
  # (amounts stay decimal Strings end-to-end, never double).
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  dio: ^5.11.1
  get_it: ^9.3.0
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  intl: ^0.20.3
  uuid: ^4.6.0
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
